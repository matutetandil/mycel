name: Image scan

# The image a user pulls is scanned once, when it is built, and after that
# only by Artifact Hub. Vulnerabilities keep being published against packages
# that image already contains, so its report gets worse with nobody having
# changed anything — and until this job existed, Artifact Hub's email was how
# anyone found out. This scans the latest published release on a schedule, the
# same way Artifact Hub does, and fails (which notifies) when something with a
# fix shows up.
#
# The summary splits findings by where the fix comes from: an `alpine` finding
# is cleared by rebuilding the image (the Dockerfile upgrades Alpine packages),
# a Go module finding needs a dependency bump, and a `stdlib` one needs a
# rebuild on the newest Go patch release. That tells a patch release apart from
# a dependency change before anyone opens a branch.

on:
  schedule:
    - cron: "23 7 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
          echo "image=mdenda/mycel:${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Summarise every finding
        if: always()
        run: |
          docker run --rm aquasec/trivy:latest image --quiet \
            --scanners vuln --format json "${{ steps.release.outputs.image }}" > report.json
          {
            echo "## ${{ steps.release.outputs.image }}"
            echo
            echo "| Fix comes from | Severity | Package | Installed | Fixed | ID |"
            echo "|---|---|---|---|---|---|"
            jq -r '.Results[]? | .Type as $t | (.Vulnerabilities // [])[] |
              [ (if $t == "alpine" then "rebuild (Alpine)"
                 elif .PkgName == "stdlib" then "rebuild (Go patch)"
                 else "dependency bump" end),
                .Severity, .PkgName, .InstalledVersion, (.FixedVersion // "none"),
                .VulnerabilityID ] | "| " + join(" | ") + " |"' report.json
          } >> "$GITHUB_STEP_SUMMARY"

      # The same gate as the dependency scan on pull requests: HIGH or CRITICAL
      # with a fix available, minus what .trivyignore accepts until its date.
      - name: Fail on a fixable HIGH or CRITICAL
        run: |
          docker run --rm -v "$PWD":/src aquasec/trivy:latest image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile /src/.trivyignore \
            --exit-code 1 \
            "${{ steps.release.outputs.image }}"

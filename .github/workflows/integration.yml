name: Integration Tests

on:
  workflow_dispatch:
  # Ran by hand only, which meant it ran when someone remembered. Twelve
  # services and 146 assertions are worth several minutes on a pull request:
  # nothing else exercises the connectors against real brokers, so a
  # regression there was previously found after merging, if at all.
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: tests/integration

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install grpcurl
        run: go install github.com/fullstorydev/grpcurl/cmd/grpcurl@latest

      # ---------------------------------------------------------------
      # Start all services
      # ---------------------------------------------------------------
      - name: Start services
        env:
          # The binary is built with -cover and writes its counters to the
          # mounted directory when it shuts down. Nothing else about the run
          # changes; without these two the build is byte-identical.
          COVERAGE: "-cover"
          GOCOVERDIR: /covdata
        run: |
          # The container runs as uid 1000 and has to be able to write here.
          mkdir -p .coverage && chmod 777 .coverage
          # The push connector signs a JWT with this at startup, and refuses to
          # start without one. run.sh does the same; this job does not use it.
          export FCM_SERVICE_ACCOUNT=$(bash scripts/fcm-service-account.sh)
          # The exec connector signs in to the ssh server with this key, and
          # the compose file mounts both halves. Without them docker creates
          # directories where the files should be, and a connector handed a
          # directory for a key file takes the whole service down at startup.
          # Same reason as above: this job builds the stack itself.
          bash scripts/ssh-keypair.sh
          docker compose up -d --build --wait 2>&1 | tail -10
          bash scripts/wait-for-services.sh 120

      # ---------------------------------------------------------------
      # Test groups — each step is a collapsible box in the GH UI.
      # Within each group, tests run in parallel via run-group.sh.
      # ---------------------------------------------------------------
      - name: "Test: Health & Metrics"
        run: |
          bash scripts/run-group.sh \
            scripts/test-health.sh \
            scripts/test-metrics.sh

      - name: "Test: Databases"
        run: |
          bash scripts/run-group.sh \
            scripts/test-postgres.sh \
            scripts/test-mysql.sh \
            scripts/test-mongodb.sh \
            scripts/test-sqlite.sh

      - name: "Test: Protocols"
        run: |
          bash scripts/run-group.sh \
            scripts/test-graphql.sh \
            scripts/test-grpc.sh \
            scripts/test-soap.sh \
            scripts/test-federation.sh

      - name: "Test: Messaging"
        run: |
          bash scripts/run-group.sh \
            scripts/test-rabbitmq.sh \
            scripts/test-kafka.sh

      - name: "Test: Storage & Cache"
        run: |
          bash scripts/run-group.sh \
            scripts/test-elasticsearch.sh \
            scripts/test-s3.sh \
            scripts/test-files.sh \
            scripts/test-cache.sh

      - name: "Test: Integration"
        run: |
          bash scripts/run-group.sh \
            scripts/test-transforms.sh \
            scripts/test-validation.sh \
            scripts/test-steps.sh \
            scripts/test-error-handling.sh \
            scripts/test-exec.sh \
            scripts/test-filter.sh

      - name: "Test: HTTP Client & Notifications"
        run: |
          bash scripts/test-http-client.sh
          bash scripts/test-notifications.sh

      - name: "Test: Rate Limit"
        run: bash scripts/test-rate-limit.sh

      # ---------------------------------------------------------------
      # Cleanup & diagnostics
      # ---------------------------------------------------------------
      # ---------------------------------------------------------------
      # Coverage. The counters are written while the service shuts down, so
      # this has to come after the services are stopped and before anything
      # removes the volume.
      # ---------------------------------------------------------------
      # Before the teardown, not after it. These ran after `docker compose
      # down -v`, so every one of them reported on a stack that no longer
      # existed: the log step printed nothing, `ps -a` printed a header and no
      # rows, and a failing run said nothing about why. Two CI rounds were
      # spent guessing at a container whose log was there the whole time.
      - name: Mycel logs on failure
        if: failure()
        # No 2>/dev/null: when this step printed nothing, the silence was the
        # only thing it told us, and the reason it printed nothing was hidden
        # by the redirect. The services beside it are here because a connector
        # that cannot reach one is how Mycel fails at startup.
        run: |
          echo "--- mycel ---"
          docker compose logs --no-color --tail 100 mycel || true
          echo "--- what the stack made of itself ---"
          docker compose ps -a || true
          echo "--- the one-shot setup containers ---"
          docker compose logs --no-color redis-sentinel redis-cluster-init kafka-init minio-init || true

      - name: All service logs on failure
        if: failure()
        run: docker compose logs 2>/dev/null || true

      - name: Stop services
        if: always()
        run: docker compose down -v

      - name: Coverage from the integration run
        if: always()
        run: |
          if [ ! -d .coverage ] || [ -z "$(ls -A .coverage 2>/dev/null)" ]; then
            echo "No counters were written — the service did not shut down cleanly." >&2
            exit 0
          fi

          # The unit tests, in the same binary format, so the two can be added
          # together rather than reported as separate halves of one number.
          mkdir -p .coverage-unit
          unit_dir="$(pwd)/.coverage-unit"
          (cd ../.. && go test ./... -coverpkg=./... -args -test.gocoverdir="$unit_dir") > /dev/null 2>&1 || true

          mkdir -p .coverage-merged
          go tool covdata merge -i=.coverage,.coverage-unit -o .coverage-merged
          go tool covdata textfmt -i=.coverage-merged -o coverage.out

          # Each figure comes the same way, so the three are comparable:
          # `covdata percent` reports per package and has no total line.
          percent() {
            go tool covdata textfmt -i="$1" -o "$2" 2>/dev/null || return
            go tool cover -func="$2" | tail -1 | awk '{print $NF}'
          }
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}')
          unit=$(percent .coverage-unit unit.out)
          integration=$(percent .coverage integration.out)

          {
            echo "## Coverage"
            echo
            echo "| Source | Statements |"
            echo "|---|---|"
            echo "| Unit tests | ${unit:-n/a} |"
            echo "| Integration run | ${integration:-n/a} |"
            echo "| **Together** | **${total}** |"
            echo
            echo "The integration figure is what the running binary exercised against the"
            echo "real services. The two are merged rather than averaged, so the total is"
            echo "at least the larger of them: a line covered by both is covered once."
            echo
            echo "Counted with -coverpkg=./..., so a test in one package counts for the"
            echo "code it exercises in another. That reads higher than the per-package"
            echo "figure the unit workflow reports, and it is the same code either way."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: tests/integration/coverage.out
          if-no-files-found: ignore


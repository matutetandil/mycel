name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -cover ./...

  helm-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Lint chart
        run: helm lint ./helm/mycel

      - name: Template validation
        run: helm template test ./helm/mycel > /dev/null

  # Nothing scanned dependencies until 3.7.1, and it showed twice: a HIGH in
  # grpc and then one in amqp091-go were both found by Artifact Hub, after the
  # release, by scanning the chart we had already published. The second one had
  # been public for nine days before the release that shipped it.
  #
  # The tree, not the image. A HIGH in an OS package would be worth catching
  # too, but the image here is built from a layer cache, and a cached
  # `apk upgrade` layer reports the packages of whenever it was built rather
  # than of today — a scan that lies is worse than no scan. The published image
  # is built cold and scanned by Artifact Hub.
  #
  # Only findings that have a fix fail the build. One without a fix is nobody's
  # to act on, and blocking every pull request on it teaches people to skip the
  # job.
  deps-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Scan dependencies
        run: |
          docker run --rm -v "$PWD":/src aquasec/trivy:latest fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            /src

      # Reported, never blocking: the same scan without the fix filter, so a
      # vulnerability with no fix published is visible in the job's output on
      # the day it appears instead of on the day someone thinks to look.
      - name: Report findings that have no fix yet
        if: always()
        run: |
          docker run --rm -v "$PWD":/src aquasec/trivy:latest fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            /src

  # The release builds and publishes the runtime image, and until this job
  # existed that was the first time it was ever built. A Dockerfile that no
  # longer matches the source only failed once a tag existed, which is the
  # expensive moment to find out: v2.10.0 shipped a go.mod requiring Go 1.25
  # against a golang:1.24 base and the release had to be re-tagged.
  #
  # Single platform on purpose. The release builds amd64 and arm64 through
  # QEMU and takes ~24 minutes for it; the binary is pure Go built with
  # CGO_ENABLED=0, so an arm64-only failure is rare and not worth that on
  # every pull request. Runs alongside the other jobs, so it costs wall-clock
  # only when it is slower than they are.
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Broke in the same release, and is otherwise only built when someone
      # runs the integration suite by hand.
      - name: Build integration mock server
        uses: docker/build-push-action@v7
        with:
          context: tests/integration/mock-server
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

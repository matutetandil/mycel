name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -cover ./...

  helm-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Lint chart
        run: helm lint ./helm/mycel

      - name: Template validation
        run: helm template test ./helm/mycel > /dev/null

  # The release builds and publishes the runtime image, and until this job
  # existed that was the first time it was ever built. A Dockerfile that no
  # longer matches the source only failed once a tag existed, which is the
  # expensive moment to find out: v2.10.0 shipped a go.mod requiring Go 1.25
  # against a golang:1.24 base and the release had to be re-tagged.
  #
  # Single platform on purpose. The release builds amd64 and arm64 through
  # QEMU and takes ~24 minutes for it; the binary is pure Go built with
  # CGO_ENABLED=0, so an arm64-only failure is rare and not worth that on
  # every pull request. Runs alongside the other jobs, so it costs wall-clock
  # only when it is slower than they are.
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Broke in the same release, and is otherwise only built when someone
      # runs the integration suite by hand.
      - name: Build integration mock server
        uses: docker/build-push-action@v7
        with:
          context: tests/integration/mock-server
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

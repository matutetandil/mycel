name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY_GITHUB: ghcr.io
  REGISTRY_DOCKERHUB: docker.io
  IMAGE_NAME_GITHUB: ${{ github.repository }}
  IMAGE_NAME_DOCKERHUB: mdenda/mycel

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign exchanges this OIDC token for a short-lived
      # Fulcio certificate, so there is no private key to store or rotate.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY_GITHUB }}/${{ env.IMAGE_NAME_GITHUB }}
            ${{ env.REGISTRY_DOCKERHUB }}/${{ env.IMAGE_NAME_DOCKERHUB }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GITHUB }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      # Signing by digest rather than by tag covers every tag pointing at this
      # manifest at once, and cannot drift if a tag is later moved. The digest
      # is content-addressed, so it is the same in both registries.
      - name: Sign the images
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${REGISTRY_GITHUB}/${IMAGE_NAME_GITHUB}@${DIGEST}"
          cosign sign --yes "${IMAGE_NAME_DOCKERHUB}@${DIGEST}"

  helm-release:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
      packages: write
      # See the note on the same permission in build-and-push.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Update Chart version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.version }}/" helm/mycel/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.version }}\"/" helm/mycel/Chart.yaml
          # The artifacthub.io/images annotation names the same image, and a
          # stale tag there is what Artifact Hub shows on the chart page.
          sed -i "s|image: mdenda/mycel:.*|image: mdenda/mycel:${{ steps.version.outputs.version }}|" helm/mycel/Chart.yaml
          cat helm/mycel/Chart.yaml

      - name: Package Helm chart
        run: |
          helm package helm/mycel --destination .helm-packages

      # Two logins, deliberately. `helm registry login` writes to Helm's own
      # credential store, which nothing else reads; cosign and oras read the
      # Docker config. Signing the chart failed in the 2.18.0 release with
      # "UNAUTHORIZED: unauthenticated" for exactly this reason — the images
      # signed fine because docker/login-action had already run in that job.
      - name: Login to GitHub Container Registry (Helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Login to GitHub Container Registry (Docker config, for cosign and oras)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # helm push reports the digest on stderr; capture it rather than
      # re-resolving the tag, so the signature is tied to exactly what was
      # just pushed.
      - name: Push Helm chart to GHCR
        id: chart
        run: |
          # Without pipefail the pipeline reports tee's exit code, so a failed
          # push would sail through. Actions' default shell does not set it.
          set -euo pipefail
          helm push .helm-packages/mycel-${{ steps.version.outputs.version }}.tgz \
            oci://ghcr.io/${{ github.repository_owner }}/charts 2>&1 | tee /tmp/helm-push.log
          # `|| true` so that a missing digest reaches the check below with its
          # own message, instead of errexit killing the step on grep's status.
          DIGEST=$(grep -oE 'sha256:[0-9a-f]{64}' /tmp/helm-push.log | head -1 || true)
          if [ -z "$DIGEST" ]; then
            echo "could not read the chart digest from helm push output" >&2
            cat /tmp/helm-push.log >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Chart digest: $DIGEST"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      # This is what flips the "signed" flag on the Artifact Hub chart page:
      # for an OCI repository it looks for cosign signatures attached to the
      # chart by cosign's tag-based discovery.
      - name: Sign the Helm chart
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/charts/mycel@${{ steps.chart.outputs.digest }}"

      # Artifact Hub reads its repository metadata from a reserved tag on the
      # same OCI repository as the chart, not from a file in the chart. The
      # media types below are the ones it looks for; it ignores anything else.
      - name: Set up ORAS
        uses: oras-project/setup-oras@v2

      # `helm registry login` writes to Helm's own credential store, which oras
      # does not read, so this login is not redundant.
      - name: Log ORAS in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Artifact Hub repository metadata
        run: |
          oras push \
            ghcr.io/${{ github.repository_owner }}/charts/mycel:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            helm/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Upload Helm chart to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: .helm-packages/mycel-${{ steps.version.outputs.version }}.tgz

  create-release:
    runs-on: ubuntu-latest
    needs: [build-and-push, helm-release]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Lifts this version's Breaking and Security sections out of the
      # changelog so the release page leads with them.
      #
      # The 3.0.0 release went out with GitHub's generated notes alone: a list
      # of pull request titles that said nothing about `mfa { required }`
      # starting to require it, or about the module path moving to /v3. A major
      # version exists to make someone read before they upgrade, and the page
      # they land on has to be the one that tells them.
      #
      # Only Breaking and Security are lifted, not the whole section: 3.0.0's
      # runs to 117 KB against a 125 KB limit on the release body, so a bigger
      # release would fail to publish. Everything else is one link away.
      - name: Assemble the release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"

          section=$(awk -v hdr="## [$version]" '
            index($0, hdr) == 1 { f = 1; next }
            /^## \[/ { if (f) exit }
            f { print }
          ' CHANGELOG.md)

          if [ -z "$(printf '%s' "$section" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no section for $version. Add one before tagging." >&2
            exit 1
          fi

          warnings=$(printf '%s\n' "$section" | awk '
            /^### / { keep = ($0 ~ /^### (Breaking|Security)/) }
            keep
          ')

          changelog="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md"

          {
            if [ -n "$(printf '%s' "$warnings" | tr -d '[:space:]')" ]; then
              echo "**Read this before upgrading.** The full detail for every change is in [CHANGELOG.md]($changelog)."
              echo
              printf '%s\n' "$warnings"
            else
              echo "Every change in this release is listed in [CHANGELOG.md]($changelog)."
            fi
            echo
            echo "---"
            echo
          } > release-notes.md

          size=$(wc -c < release-notes.md)
          echo "Assembled $size bytes of notes for $version."
          # The generated pull request list is appended to this by the API, so
          # leave room for it under the 125,000 character ceiling.
          if [ "$size" -gt 100000 ]; then
            echo "::error::Release notes are $size bytes; the release body caps at 125,000." >&2
            exit 1
          fi

      # `body_path` with `generate_release_notes` puts the changelog warnings
      # first and GitHub's generated pull request list underneath.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          generate_release_notes: true

  # Keeps the Homebrew tap pointing at the release just published.
  #
  # Runs after create-release rather than alongside it, so a failure here — a
  # missing or expired token being the likely one — leaves the image, the chart
  # and the GitHub release already published. A red mark on this job then means
  # exactly one thing: the tap was not updated. It is deliberately not skipped
  # when the secret is absent; a step that quietly does nothing is how a tap
  # ends up months behind without anyone noticing.
  homebrew:
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: Resolve version and source checksum
        id: src
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"

          # GitHub generates this tarball per tag; it is what the formula
          # builds from, so no release artifact is needed beyond it.
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "url=$url"         >> "$GITHUB_OUTPUT"
          echo "sha256=$sha"      >> "$GITHUB_OUTPUT"
          echo "Formula will point at $version ($sha)"

      - name: Checkout tap
        uses: actions/checkout@v6
        with:
          repository: matutetandil/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        working-directory: tap
        run: |
          set -euo pipefail
          formula=Formula/mycel.rb

          sed -i -E "s|^  url \".*\"|  url \"${{ steps.src.outputs.url }}\"|"       "$formula"
          sed -i -E "s|^  sha256 \".*\"|  sha256 \"${{ steps.src.outputs.sha256 }}\"|" "$formula"

          # Fail rather than commit a formula the edit did not actually land in:
          # a sed that silently matches nothing would leave the tap on the old
          # version while reporting success.
          grep -q "${GITHUB_REF_NAME}.tar.gz"          "$formula"
          grep -q "${{ steps.src.outputs.sha256 }}"    "$formula"

          git diff --stat

      - name: Commit and push
        working-directory: tap
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Formula already at ${{ steps.src.outputs.version }}; nothing to do."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "mycel ${{ steps.src.outputs.version }}"
          git push

  # Binaries and Linux packages, attached to the release create-release just
  # made. goreleaser only builds here — the release itself, its notes and the
  # Helm chart are owned by the jobs above.
  #
  # The packages carry more than the binary: a systemd unit, an unprivileged
  # user and /etc/mycel. Installing on a VM otherwise leaves the operator to
  # invent all three.
  packages:
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archives and packages
        uses: goreleaser/goreleaser-action@v7
        with:
          # `latest` warns that it locks to the current major anyway. Naming
          # the major keeps the pin and drops the warning; .goreleaser.yml
          # declares `version: 2`, which is that same major.
          version: "~> v2"
          args: release --clean

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/checksums.txt

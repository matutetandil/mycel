name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY_GITHUB: ghcr.io
  REGISTRY_DOCKERHUB: docker.io
  IMAGE_NAME_GITHUB: ${{ github.repository }}
  IMAGE_NAME_DOCKERHUB: mdenda/mycel

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY_GITHUB }}/${{ env.IMAGE_NAME_GITHUB }}
            ${{ env.REGISTRY_DOCKERHUB }}/${{ env.IMAGE_NAME_DOCKERHUB }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GITHUB }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-release:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Update Chart version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.version }}/" helm/mycel/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.version }}\"/" helm/mycel/Chart.yaml
          cat helm/mycel/Chart.yaml

      - name: Package Helm chart
        run: |
          helm package helm/mycel --destination .helm-packages

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Helm chart to GHCR
        run: |
          helm push .helm-packages/mycel-${{ steps.version.outputs.version }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Upload Helm chart to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: .helm-packages/mycel-${{ steps.version.outputs.version }}.tgz

  create-release:
    runs-on: ubuntu-latest
    needs: [build-and-push, helm-release]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  # Keeps the Homebrew tap pointing at the release just published.
  #
  # Runs after create-release rather than alongside it, so a failure here — a
  # missing or expired token being the likely one — leaves the image, the chart
  # and the GitHub release already published. A red mark on this job then means
  # exactly one thing: the tap was not updated. It is deliberately not skipped
  # when the secret is absent; a step that quietly does nothing is how a tap
  # ends up months behind without anyone noticing.
  homebrew:
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: Resolve version and source checksum
        id: src
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"

          # GitHub generates this tarball per tag; it is what the formula
          # builds from, so no release artifact is needed beyond it.
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "url=$url"         >> "$GITHUB_OUTPUT"
          echo "sha256=$sha"      >> "$GITHUB_OUTPUT"
          echo "Formula will point at $version ($sha)"

      - name: Checkout tap
        uses: actions/checkout@v6
        with:
          repository: matutetandil/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        working-directory: tap
        run: |
          set -euo pipefail
          formula=Formula/mycel.rb

          sed -i -E "s|^  url \".*\"|  url \"${{ steps.src.outputs.url }}\"|"       "$formula"
          sed -i -E "s|^  sha256 \".*\"|  sha256 \"${{ steps.src.outputs.sha256 }}\"|" "$formula"

          # Fail rather than commit a formula the edit did not actually land in:
          # a sed that silently matches nothing would leave the tap on the old
          # version while reporting success.
          grep -q "${GITHUB_REF_NAME}.tar.gz"          "$formula"
          grep -q "${{ steps.src.outputs.sha256 }}"    "$formula"

          git diff --stat

      - name: Commit and push
        working-directory: tap
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Formula already at ${{ steps.src.outputs.version }}; nothing to do."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "mycel ${{ steps.src.outputs.version }}"
          git push

  # Binaries and Linux packages, attached to the release create-release just
  # made. goreleaser only builds here — the release itself, its notes and the
  # Helm chart are owned by the jobs above.
  #
  # The packages carry more than the binary: a systemd unit, an unprivileged
  # user and /etc/mycel. Installing on a VM otherwise leaves the operator to
  # invent all three.
  packages:
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archives and packages
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/checksums.txt

<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#141d44"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ee787"/>
      <stop offset="100%" stop-color="#56d4dd"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="60" fill="url(#bg)"/>
  <!-- mycelium edges -->
  <g stroke="url(#edge)" stroke-width="6" stroke-linecap="round" opacity="0.92">
    <line x1="128" y1="128" x2="62"  y2="66"/>
    <line x1="128" y1="128" x2="198" y2="74"/>
    <line x1="128" y1="128" x2="66"  y2="194"/>
    <line x1="128" y1="128" x2="196" y2="188"/>
    <line x1="128" y1="128" x2="128" y2="52"/>
    <line x1="62"  y1="66"  x2="128" y2="52"/>
    <line x1="198" y1="74"  x2="196" y2="188"/>
  </g>
  <!-- outer nodes -->
  <g fill="#56d4dd">
    <circle cx="62"  cy="66"  r="14"/>
    <circle cx="198" cy="74"  r="14"/>
    <circle cx="66"  cy="194" r="14"/>
    <circle cx="196" cy="188" r="14"/>
    <circle cx="128" cy="52"  r="11"/>
  </g>
  <!-- center node -->
  <circle cx="128" cy="128" r="26" fill="#7ee787"/>
  <circle cx="128" cy="128" r="26" fill="none" stroke="#0b1020" stroke-width="4"/>
</svg>

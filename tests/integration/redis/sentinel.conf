# Sentinel watches the stack's redis and tells a client which server is master.
#
# A file rather than a shell one-liner in the compose command: that version was
# a printf with six quoted arguments inside a YAML folded scalar, and it came
# out as different arguments on a different docker compose — "wrong number of
# arguments", from redis, about a config it had been handed mangled.
#
# Order matters here. `sentinel monitor` names a host rather than an address,
# which redis refuses unless resolve-hostnames has already been read.
port 26379

sentinel resolve-hostnames yes
sentinel announce-hostnames yes

sentinel monitor mymaster redis 6379 1
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000

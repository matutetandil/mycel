name: mycel-integration

services:
  # ==========================================================================
  # Mycel - Main service under test
  # ==========================================================================
  mycel:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        # Empty unless the run asks for coverage, in which case the binary is
        # built with -cover and drops counters into GOCOVERDIR on shutdown.
        COVERAGE: ${COVERAGE:-}
    ports:
      - "${PORT_REST:-3000}:3000"     # REST (tests access from host)
      - "${PORT_GQL:-4000}:4000"      # GraphQL
      - "${PORT_SOAP:-8081}:8081"     # SOAP
      - "${PORT_GRPC:-50051}:50051"   # gRPC
      - "${PORT_ADMIN:-9090}:9090"    # Admin (health/metrics)
      - "${PORT_AUTH:-3003}:3003"     # REST behind auth
      - "${PORT_WORKFLOW:-9101}:9091" # Workflow api (its own port, authenticated)
    volumes:
      - ./config:/etc/mycel
      # The key the exec connector signs in with. Generated per run.
      - ./ssh/id_ed25519:/etc/mycel-ssh/id_ed25519:ro
      # Always mounted; the binary only writes here when built with -cover.
      - ./.coverage:/covdata
    # A -cover binary writes its counters as it exits, and the default ten
    # seconds is not always enough for a service holding a dozen connectors to
    # shut down cleanly. Being killed instead loses the whole measurement.
    stop_grace_period: 90s
    environment:
      MYCEL_ENV: development
      GOCOVERDIR: ${GOCOVERDIR:-}
      MYCEL_LOG_LEVEL: debug
      # Off unless asked for: MYCEL_PAYLOAD_SHOW=true bash run.sh logs the raw
      # payload every source hands to a flow, which is the only way to see the
      # shape a message actually arrives in.
      MYCEL_PAYLOAD_SHOW: "${MYCEL_PAYLOAD_SHOW:-}"
      MYCEL_LOG_FORMAT: text
      # PostgreSQL
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: mycel
      PG_PASS: mycel
      PG_DB: mycel_test
      # MySQL
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: mycel
      MYSQL_PASS: mycel
      MYSQL_DB: mycel_test
      # MongoDB
      MONGO_URI: "mongodb://mongo:mycel@mongodb:27017/mycel_test?authSource=admin"
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      # Kafka
      KAFKA_BROKERS: "kafka:9092"
      # Elasticsearch
      ES_NODES: "http://elasticsearch:9200"
      # MinIO (S3)
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: test-bucket
      # Mock server (for HTTP client + notifications)
      MOCK_URL: "http://mock:8888"
      # Generated per run by run.sh; the push connector signs a JWT with it.
      FCM_SERVICE_ACCOUNT: "${FCM_SERVICE_ACCOUNT:-}"
      # MQTT
      MQTT_BROKER: "tcp://mosquitto:1883"
      # SFTP
      SFTP_HOST: sftp
      SFTP_PORT: "22"
      SFTP_USER: testuser
      SFTP_PASS: testpass
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mock:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      ssh-exec:
        condition: service_healthy
      # Named here for the same reason as everything else in this list: a
      # connector resolves the hostname at startup, and a name with no
      # container behind it yet is not a slow answer but "server misbehaving"
      # from docker's resolver — which is a connector that cannot start, and a
      # service that exits. The cluster below is covered through its init
      # container, which already waits on all three nodes.
      redis-sentinel:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
      sftp:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10

  # ==========================================================================
  # Databases (internal only - no host ports exposed)
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    # Published so the Go tests for the SQL auth stores can reach it. Those
    # stores speak Postgres and MySQL, not something a unit test can stand up,
    # so this is the only place they run at all. The default is away from 5432
    # so a developer's own database is not in the way.
    ports:
      - "${PORT_PG:-55432}:5432"
    environment:
      POSTGRES_USER: mycel
      POSTGRES_PASSWORD: mycel
      POSTGRES_DB: mycel_test
    volumes:
      - ./seed/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=4
        -c max_wal_senders=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycel -d mycel_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8
    # Published for the same reason as postgres above: the MySQL auth stores
    # only run here.
    ports:
      - "${PORT_MYSQL:-33306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mycel_test
      MYSQL_USER: mycel
      MYSQL_PASSWORD: mycel
    volumes:
      - ./seed/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:7
    # Published for the Go tests of the driver's write operations, which the
    # flows here do not all reach.
    ports:
      - "${PORT_MONGO:-37017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mycel
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ==========================================================================
  # Cache (internal only)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    # Published so a test on the host can reach it, as the other stores are.
    ports:
      - "${PORT_REDIS:-36379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Sentinel watches the redis above and tells a client which server is master.
  #
  # It exists so the `sentinel` block a cache connector takes can be pointed at
  # something that answers — without it the block could be parsed and turned
  # into a client that was never asked anything. One sentinel is not a quorum
  # and would not fail anything over in earnest; what it does provide is the
  # master lookup, which is what the connector actually performs.
  redis-sentinel:
    image: redis:7-alpine
    depends_on:
      redis:
        condition: service_healthy
    command: >
      sh -c "printf '%s\n'
      'port 26379'
      'sentinel monitor mymaster redis 6379 1'
      'sentinel down-after-milliseconds mymaster 5000'
      'sentinel failover-timeout mymaster 10000'
      'sentinel resolve-hostnames yes'
      > /tmp/sentinel.conf && redis-server /tmp/sentinel.conf --sentinel"
    ports:
      - "${PORT_REDIS_SENTINEL:-36380}:26379"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # A three-node cluster, which is the smallest one Redis will form: the key
  # space is split into slots and each node owns a share, so a client is not
  # given an address but a list of them and asked to find out who holds what.
  #
  # Internal only. A cluster answers a client with the addresses of its nodes,
  # and those are addresses on this network — which is why the test that uses
  # it runs inside the network too.
  redis-cluster-1: &redis-cluster-node
    image: redis:7-alpine
    command: >
      redis-server --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly no --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis-cluster-2:
    <<: *redis-cluster-node

  redis-cluster-3:
    <<: *redis-cluster-node

  # Forms the cluster once the three are answering. `--cluster-yes` because
  # there is nobody here to confirm the slot allocation.
  redis-cluster-init:
    image: redis:7-alpine
    depends_on:
      redis-cluster-1:
        condition: service_healthy
      redis-cluster-2:
        condition: service_healthy
      redis-cluster-3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if redis-cli -h redis-cluster-1 cluster info | grep -q 'cluster_state:ok'; then
          echo "cluster already formed"
          exit 0
        fi
        redis-cli --cluster create \
          redis-cluster-1:6379 redis-cluster-2:6379 redis-cluster-3:6379 \
          --cluster-yes
        until redis-cli -h redis-cluster-1 cluster info | grep -q 'cluster_state:ok'; do
          sleep 1
        done
        echo "cluster formed"

  # ==========================================================================
  # Message Queues (internal only)
  # ==========================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      # Exposed so the strict-declare integration test (go test against a
      # real broker) can reach the broker from the host.
      - "${PORT_RABBIT:-5672}:5672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Two listeners: one for containers on this network, one published to
      # the host so the Go tests that need a real broker can reach it. A Kafka
      # client is told where to reconnect by the advertised address, so a
      # single listener cannot serve both — from the host, "kafka:9092" does
      # not resolve.
      #
      # A third listener speaks SASL, so the `sasl` block a Kafka connector
      # takes can be exercised against a broker that actually asks who you
      # are. Same broker, same topics — only the door is different.
      KAFKA_LISTENERS: PLAINTEXT://:9092,HOST://:29092,SASL://:29094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:${PORT_KAFKA:-29092},SASL://localhost:${PORT_KAFKA_SASL:-29094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT,SASL:SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_SASL_SASL_ENABLED_MECHANISMS: PLAIN
      # The credentials the listener accepts, in the broker's own JAAS syntax.
      # Test credentials for a broker that lives as long as a test run.
      KAFKA_LISTENER_NAME_SASL_PLAIN_SASL_JAAS_CONFIG: |
        org.apache.kafka.common.security.plain.PlainLoginModule required username="mycel" password="mycel-secret" user_mycel="mycel-secret";
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: "dGVzdC1jbHVzdGVyLWlkMQ"
    ports:
      - "${PORT_KAFKA:-29092}:29092"
      - "${PORT_KAFKA_SASL:-29094}:29094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  # Create Kafka topic before Mycel starts (consumer groups need the topic to exist)
  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in test_topic dlq_topic dlq_topic.dlq orders secure_orders; do
          /opt/kafka/bin/kafka-topics.sh --create --if-not-exists \
            --bootstrap-server kafka:9092 \
            --topic "$$topic" --partitions 1 --replication-factor 1
        done

  # ==========================================================================
  # Search (internal only)
  # ==========================================================================
  elasticsearch:
    image: elasticsearch:8.12.0
    # Published so a test on the host can reach it, as the other stores are:
    # the examples that use Elasticsearch are started from outside the network.
    ports:
      - "${PORT_ES:-39200}:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ==========================================================================
  # Object Storage (internal only)
  # ==========================================================================
  minio:
    image: minio/minio
    # Published for the Go tests of the S3 operations a flow reaches through a
    # step rather than a write — copy, move, presign and the rest.
    ports:
      - "${PORT_MINIO:-39000}:9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >
      -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/test-bucket --ignore-existing &&
      echo 'Bucket test-bucket ready'
      "

  # ==========================================================================
  # MQTT Broker (internal only)
  # ==========================================================================
  mosquitto:
    image: eclipse-mosquitto:2
    # Published so the examples harness, which runs outside this network, can
    # point the mqtt example at it.
    ports:
      - "${PORT_MQTT:-31883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================================================
  # SFTP Server (internal only)
  # ==========================================================================
  sftp:
    image: emberstack/sftp
    ports:
      - "${PORT_SFTP:-32222}:22"
    volumes:
      - ./sftp/sftp.json:/app/config/sftp.json:ro

  # A server that will run a command, which the SFTP one above will not: it is
  # restricted to the sftp subsystem. Keys only — the exec connector refuses a
  # password, since there is no terminal to type one into.
  ssh-exec:
    build:
      context: ./ssh
      dockerfile: Dockerfile
    ports:
      - "${PORT_SSH_EXEC:-32223}:22"
    volumes:
      - ./ssh/authorized_keys:/home/runner/.ssh/authorized_keys:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 22 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ==========================================================================
  # Cosmo Router - GraphQL Federation Gateway
  # ==========================================================================
  cosmo-config:
    image: node:22-alpine
    working_dir: /usr/src/app
    command: sh -c "npm install -g wgc@latest && wgc router compose --input /usr/src/app/subgraphs.yaml --out /config/config.json"
    volumes:
      - ./cosmo/subgraphs.yaml:/usr/src/app/subgraphs.yaml
      - cosmo-config:/config
    depends_on:
      mycel:
        condition: service_healthy

  cosmo-router:
    image: ghcr.io/wundergraph/cosmo/router:latest
    ports:
      - "${PORT_COSMO:-5000}:5000"
    environment:
      DEV_MODE: "true"
      LISTEN_ADDR: "0.0.0.0:5000"
      EXECUTION_CONFIG_FILE_PATH: /config/config.json
      CONFIG_PATH: /config/router.yaml
      LOG_LEVEL: info
    volumes:
      - cosmo-config:/config
      - ./cosmo/router.yaml:/config/router.yaml
    depends_on:
      cosmo-config:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  # ==========================================================================
  # Mock Server (exposed - tests query captured requests from host)
  # ==========================================================================
  mock:
    build:
      context: ./mock-server
      dockerfile: Dockerfile
    ports:
      - "${PORT_MOCK:-8888}:8888"
      # The same handlers over TLS, with a certificate the server signs itself
      # and hands out at http://mock:8888/ca.pem. Nothing else in this stack
      # speaks TLS, so without it the `tls` block cannot be exercised anywhere.
      - "${PORT_MOCK_TLS:-8443}:8443"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/health"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  cosmo-config:
